      - generic [ref=f2e34]: Nova NR-1 · vigência a partir de 26/05/2026
      - heading "Saúde mental virou obrigação legal. E precisa ser documentada." [level=2] [ref=f2e35]
      - generic [ref=f2e36]:
        - paragraph [ref=f2e37]:
          - text: A atualização da NR-1 (Portaria MTE 1.419/2024) passa a exigir que
          - strong [ref=f2e38]: todas as empresas com empregados CLT
          - text: identifiquem, avaliem e gerenciem os riscos psicossociais do trabalho — sobrecarga, pressão por metas, exaustão — no mesmo nível dos riscos físicos. A partir de 26 de maio de 2026, a fiscalização passa a ter caráter punitivo.
        - paragraph [ref=f2e39]:
          - text: Na prática, a norma pede um processo
          - strong [ref=f2e40]: contínuo e documentado
          - text: ": escuta dos trabalhadores, acompanhamento de indicadores e registro ao longo do tempo. É exatamente aí que o StamFlow ajuda — gerando um acompanhamento recorrente e dados agregados que apoiam esse monitoramento."
      - paragraph [ref=f2e41]: O StamFlow é um instrumento de apoio ao acompanhamento do bem-estar da equipe. Ele não substitui o PGR, o laudo técnico nem a atuação do SESMT/medicina do trabalho — ele complementa esse processo com dados contínuos e agregados que ajudam a sustentar a gestão de riscos psicossociais.
      - button "Entender como aplicamos na sua empresa" [ref=f2e42] [cursor=pointer]
