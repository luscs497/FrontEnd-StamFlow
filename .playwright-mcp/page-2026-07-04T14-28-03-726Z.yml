        - generic [ref=f15e43]:
          - paragraph [ref=f15e44]: A atualização da NR-1 (Portaria MTE 1.419/2024) passa a exigir que todas as empresas com empregados CLT identifiquem, avaliem e gerenciem os riscos psicossociais do trabalho — sobrecarga, pressão por metas, exaustão — no mesmo nível dos riscos físicos.
          - paragraph [ref=f15e45]: "Na prática, a norma pede um processo contínuo e documentado: escuta dos trabalhadores, acompanhamento de indicadores e registro ao longo do tempo. É exatamente aí que o StamFlow ajuda — gerando um acompanhamento recorrente e dados agregados."
        - generic [ref=f15e46]: "O StamFlow é um instrumento de apoio ao acompanhamento do bem-estar da equipe. Ele não substitui o PGR, o laudo técnico nem a atuação do SESMT/medicina do trabalho — é complemento: gera dados contínuos e agregados que ajudam a sustentar a gestão de riscos psicossociais."
