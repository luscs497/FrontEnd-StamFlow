        - generic [ref=f20e43]:
          - paragraph [ref=f20e44]: A atualização da NR-1 (Portaria MTE 1.419/2024) passa a exigir que todas as empresas com empregados CLT identifiquem, avaliem e gerenciem os riscos psicossociais do trabalho — sobrecarga, pressão por metas, exaustão — no mesmo nível dos riscos físicos.
          - paragraph [ref=f20e45]: "Na prática, a norma pede um processo contínuo e documentado: escuta dos trabalhadores, acompanhamento de indicadores e registro ao longo do tempo. É exatamente aí que o StamFlow ajuda — gerando um acompanhamento recorrente e dados agregados."
